[project]
name = "support_insights"
version = "0.1.0"
description = "support_insights using crewAI"
authors = [{ name = "Your Name", email = "you@example.com" }]
requires-python = ">=3.10,<3.14"
# Core crewai only: both crews define their own BaseTool subclasses and
# nothing imports crewai_tools. The <1.10 ceiling is a platform constraint,
# not a preference: crewai 1.10+ requires lancedb>=0.29.2, and lancedb ships
# no x86_64 macOS wheel above 0.25.3, so newer crewai cannot install on an
# Intel Mac. On Apple Silicon or Linux, raise this to >=1.15.20,<2.0.0.
dependencies = [
    "crewai>=1.9.0,<1.10.0",
    "litellm>=1.75.3",
    "pypdf>=5.0.0",
    "python-dotenv>=1.1.1",
]

[project.scripts]
kickoff = "support_insights.main:kickoff"
run_crew = "support_insights.main:kickoff"
plot = "support_insights.main:plot"
run_with_trigger = "support_insights.main:run_with_trigger"
audit = "contract_audit.main:kickoff"
audit_plot = "contract_audit.main:plot"
audit_with_trigger = "contract_audit.main:run_with_trigger"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# Two packages live here: the original support insights flow, and the
# contract/invoice discrepancy audit. Hatchling only auto-detects the one
# matching the project name, so both are listed explicitly.
[tool.hatch.build.targets.wheel]
packages = ["src/support_insights", "src/contract_audit"]

[tool.crewai]
type = "flow"
project_id = "80c45d75-cdda-489d-9e37-15d9a658e6bb"

# This machine is an Intel Mac, a platform several transitive binary
# dependencies (lancedb, onnxruntime) have stopped publishing wheels for.
# Declaring it as a required environment makes uv backtrack to versions that
# actually have x86_64 macOS wheels instead of resolving to the newest
# release and failing at install time. Remove this block on Apple Silicon or
# Linux, where the newest versions install fine.
[tool.uv]
required-environments = ["sys_platform == 'darwin' and platform_machine == 'x86_64'"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
